  function openCampaignPopup(source = 'automatic') {
    if ($('.campaign-popup-backdrop')) return;
    const wrap = document.createElement('div');
    wrap.innerHTML = mainPopupHtml();
    const backdrop = wrap.firstElementChild;
    backdrop.dataset.openSource = source;
    document.body.append(backdrop);
    bindRoutes(backdrop);
    document.body.classList.add('locked');
    let active = 1;
    const show = index => {
      active = ((index - 1 + 3) % 3) + 1;
      $$('.popup-slide', backdrop).forEach(slide => slide.classList.toggle('active', number(slide.dataset.popupSlide) === active));
      $$('.popup-dots button', backdrop).forEach(dot => dot.classList.toggle('active', number(dot.dataset.slideIndex) === active));
      $('.campaign-popup', backdrop).dataset.activeCreativeId = $(`.popup-slide[data-popup-slide="${active}"]`, backdrop)?.dataset.creativeId || '';
    };
    const close = () => { backdrop.remove(); document.body.classList.remove('locked'); };
    $$('[data-action="popup-close"]', backdrop).forEach(btn => btn.addEventListener('click', close));
    $('[data-action="popup-close-today"]', backdrop)?.addEventListener('click', () => { write(STORE.popupDay, todayKey()); close(); });
    $('[data-action="popup-slide-prev"]', backdrop)?.addEventListener('click', () => show(active - 1));
    $('[data-action="popup-slide-next"]', backdrop)?.addEventListener('click', () => show(active + 1));
    $$('[data-action="popup-slide-dot"]', backdrop).forEach(btn => btn.addEventListener('click', () => show(number(btn.dataset.slideIndex))));
    backdrop.addEventListener('click', event => { if (event.target === backdrop) close(); });
    show(1);
  }

  function filterProducts() {
    let rows = [...PRODUCTS];
    const collection = query('collection');
    const category = query('category');
    const season = query('season');
    const material = query('material');
    const badge = query('badge');
    if (collection === 'best') rows = rows.filter(p => p.badge === 'BEST');
    if (collection === 'new') rows = rows.filter(p => p.badge === 'NEW');
    if (category) rows = rows.filter(p => p.category === category);
    if (season) rows = rows.filter(p => p.season === season);
    if (material) rows = rows.filter(p => p.material === material);
    if (badge) rows = rows.filter(p => p.badge === badge);
    return rows;
  }

    const provider = query('provider','kakao'); const type=query('type','login');
    main.dataset.pageType='oauth_simulator'; main.dataset.authProvider=provider; main.dataset.authType=type;
    main.innerHTML=`<section class="oauth-card"><div class="oauth-symbol ${provider}">${provider.slice(0,1).toUpperCase()}</div><span>OAUTH SIMULATOR</span><h1>${provider.toUpperCase()} ${type==='signup'?'회원가입':'로그인'}</h1><p>실제 외부 인증은 연결하지 않았습니다. 제공자·인증 유형·완료·취소 클릭을 측정할 수 있습니다.</p><dl><div><dt>provider</dt><dd>${provider}</dd></div><div><dt>auth_type</dt><dd>${type}</dd></div><div><dt>return_page</dt><dd>index.html</dd></div></dl><button class="btn dark full" type="button" data-action="oauth-complete" data-auth-provider="${provider}" data-auth-type="${type}">인증 완료 시뮬레이션</button><button class="btn outline full" type="button" data-action="oauth-cancel" data-auth-provider="${provider}" data-auth-type="${type}">취소하고 돌아가기</button></section>`;
    $('[data-action="oauth-complete"]')?.addEventListener('click',()=>{write(STORE.profile,{memberId:'M'+Math.floor(100000+Math.random()*899999),grade:type==='signup'?'WELCOME':'SILVER',name:`${provider.toUpperCase()} USER`,loginAt:new Date().toISOString()});applyIdentity();go('index.html');});
    $('[data-action="oauth-cancel"]')?.addEventListener('click',()=>history.back());
  }

  function checkoutRows() { const selected=sread('novera_checkout_selection',cart()); return selected.length?selected:cart(); }
  function renderOrderForm(main) {
    const rows=checkoutRows(); const summary=totals(rows);
    main.dataset.pageType='checkout'; main.dataset.checkoutType=query('basket_type','all'); main.dataset.value=summary.total; main.dataset.currency='KRW';
    main.innerHTML=`<section class="page-hero compact"><span>CHECKOUT</span><h1>주문서</h1><p>결제는 발생하지 않습니다.</p></section><section class="checkout-layout"><div class="checkout-main"><section class="checkout-box"><h2>주문상품</h2>${summary.lines.map((row,index)=>`<article class="checkout-line" data-component="checkout-item" ${dataset(itemData(row.item,{quantity:row.quantity,index:index+1}))}>${productVisual(row.item,'mini')}<div><strong>${esc(row.item.nameKo)}</strong><span>${esc(row.variant)} · ${row.quantity}개</span></div><b>${won(row.item.price*row.quantity)}</b></article>`).join('')}</section><section class="checkout-box"><h2>주문자 정보</h2><div class="form-grid"><label>이름<input value="테스트 주문자" data-field-name="customer_name"></label><label>연락처<input value="010-0000-0000" data-field-name="customer_phone"></label><label class="wide">주소<input value="서울시 테스트구 측정로 100" data-field-name="shipping_address"></label></div></section><section class="checkout-box"><h2>배송 방법</h2><div class="option-cards">${[['parcel','일반 택배','3,000원'],['quick','퀵 배송','8,000원'],['pickup','매장 픽업','무료']].map(([value,label,desc],i)=>`<label><input type="radio" name="shipping" value="${value}" ${i===0?'checked':''} data-action="shipping-method-select" data-shipping-tier="${value}"><span><strong>${label}</strong><small>${desc}</small></span></label>`).join('')}</div></section><section class="checkout-box"><h2>결제 수단</h2><div class="option-cards">${[['card','신용카드'],['naverpay','네이버페이'],['kakaopay','카카오페이'],['bank','무통장입금']].map(([value,label],i)=>`<label><input type="radio" name="payment" value="${value}" ${i===0?'checked':''} data-action="payment-method-select" data-payment-type="${value}"><span><strong>${label}</strong><small>테스트 결제</small></span></label>`).join('')}</div></section></div><aside class="order-summary"><h2>PAYMENT</h2><dl><div><dt>상품금액</dt><dd>${won(summary.subtotal)}</dd></div><div><dt>배송비</dt><dd>${won(summary.shipping)}</dd></div><div class="total"><dt>최종금액</dt><dd>${won(summary.total)}</dd></div></dl><label class="check-row"><input id="purchaseAgree" type="checkbox" data-action="purchase-agreement-check"><span>주문 내용을 확인했습니다.</span></label><button class="btn dark full" type="button" data-action="purchase-test" ${dataset({transactionValue:summary.total,currency:'KRW',checkoutType:main.dataset.checkoutType})}>테스트 주문 완료</button><p class="safe-note">실제 결제·PG 호출은 없습니다.</p></aside></section>`;
    $('[data-action="purchase-test"]')?.addEventListener('click',()=>{
      if(!$('#purchaseAgree').checked){showToast('주문 확인에 동의하세요.');return;}
      const order={transactionId:`T${Date.now()}`,createdAt:new Date().toISOString(),rows,shippingMethod:$('input[name="shipping"]:checked').value,paymentMethod:$('input[name="payment"]:checked').value,...summary};
      const orders=read(STORE.orders,[]);orders.unshift(order);write(STORE.orders,orders);saveCart([]);swrite('novera_checkout_selection',[]);swrite('novera_last_order',order);go('order/order_result.html');
    });
  }

  function renderOrderResult(main) {
    const order=sread('novera_last_order',read(STORE.orders,[])[0]);
    main.dataset.pageType='purchase';
    if(!order){main.innerHTML='<div class="empty-state"><strong>주문 정보가 없습니다.</strong><a data-route="product/list.html">상품 보기</a></div>';bindRoutes(main);return;}
    main.dataset.transactionId=order.transactionId; main.dataset.value=order.total; main.dataset.currency='KRW'; main.dataset.shipping=order.shipping; main.dataset.paymentMethod=order.paymentMethod;
    main.innerHTML=`<section class="purchase-complete" data-component="purchase-summary" ${dataset({transactionId:order.transactionId,value:order.total,currency:'KRW',shipping:order.shipping,paymentMethod:order.paymentMethod,shippingMethod:order.shippingMethod})}><span>ORDER COMPLETE</span><h1>테스트 주문이 완료되었습니다.</h1><p>주문번호 <strong>${order.transactionId}</strong></p></section><section class="purchase-detail"><h2>주문 상품</h2>${cartLines(order.rows).map((row,index)=>`<article data-component="purchase-item" ${dataset(itemData(row.item,{quantity:row.quantity,index:index+1}))}>${productVisual(row.item,'mini')}<div><strong>${esc(row.item.nameKo)}</strong><span>${esc(row.variant)} · ${row.quantity}개</span></div><b>${won(row.item.price*row.quantity)}</b></article>`).join('')}<dl><div><dt>상품금액</dt><dd>${won(order.subtotal)}</dd></div><div><dt>배송비</dt><dd>${won(order.shipping)}</dd></div><div><dt>결제수단</dt><dd>${order.paymentMethod}</dd></div><div class="total"><dt>총 결제금액</dt><dd>${won(order.total)}</dd></div></dl><div class="center-actions"><a class="btn dark" data-action="purchase-order-list-click" data-route="myshop/order/list.html">주문내역 보기</a><a class="btn outline" data-action="purchase-continue-click" data-route="product/list.html">쇼핑 계속하기</a></div></section>`;
    bindRoutes(main);
  }

  function renderOrders(main) {
    const orders=read(STORE.orders,[]); const profile=read(STORE.profile,null);
    main.dataset.pageType='order_history';
    main.innerHTML=`<section class="account-header"><div><span>MY PAGE</span><h1>${profile?esc(profile.name):'GUEST'}님의 주문내역</h1></div><dl><div><dt>회원상태</dt><dd>${profile?'회원':'비회원'}</dd></div><div><dt>등급</dt><dd>${profile?.grade||'GUEST'}</dd></div><div><dt>주문수</dt><dd>${orders.length}</dd></div></dl></section>${orders.length?`<section class="order-history">${orders.map((order,index)=>`<article data-component="order-history-item" data-transaction-id="${order.transactionId}" data-order-index="${index+1}" data-order-value="${order.total}"><div><span>${new Date(order.createdAt).toLocaleDateString('ko-KR')}</span><strong>${order.transactionId}</strong></div><p>${cartLines(order.rows).map(x=>x.item.nameKo).join(', ')}</p><b>${won(order.total)}</b><button type="button" data-action="order-detail-click" data-transaction-id="${order.transactionId}">상세보기</button></article>`).join('')}</section>`:`<div class="empty-state"><strong>주문 내역이 없습니다.</strong><a class="btn dark" data-route="product/list.html">쇼핑하기</a></div>`}`;
    bindRoutes(main);
    $$('[data-action="order-detail-click"]').forEach(btn=>btn.addEventListener('click',()=>showToast(`${btn.dataset.transactionId} 상세보기 클릭`)));
  }

  const BOARD_DATA={
    notice:['배송 일정 안내','회원 등급 정책 변경 안내','개인정보 처리방침 개정'],
    event:['여름 컬렉션 댓글 이벤트','신규 회원 쿠폰 이벤트','리뷰 적립금 이벤트'],
    qna:['상품 사이즈 문의','재입고 일정 문의','배송지 변경 문의'],
    review:['컨투어 볼캡 착용 리뷰','버킷햇 여름 코디 리뷰','비니 컬러 비교 리뷰'],
    supporters:['NOVERA CREW 2기 모집','서포터즈 활동 가이드','월간 베스트 크리에이터'],
    news:['26 SUMMER COLLECTION 공개','브랜드 팝업 스토어 오픈','새로운 캠페인 소식']
  };
  function renderCommunity(main){
    const board=query('board','notice'); const rows=BOARD_DATA[board]||BOARD_DATA.notice;
    main.dataset.pageType='community_list';main.dataset.boardType=board;
    main.innerHTML=`<section class="page-hero"><span>COMMUNITY</span><h1>${board.toUpperCase()}</h1><p>게시판 메뉴·게시글·페이지 이동 클릭을 구분해보세요.</p></section><nav class="board-tabs">${Object.keys(BOARD_DATA).map(key=>`<a class="${key===board?'active':''}" data-action="board-tab-click" data-board-type="${key}" data-route="community/list.html?board=${key}">${key.toUpperCase()}</a>`).join('')}</nav><section class="board-list">${rows.map((title,index)=>`<article data-component="board-row" data-board-type="${board}" data-post-id="${board}_${index+1}" data-post-index="${index+1}"><span>${String(index+1).padStart(2,'0')}</span><button type="button" data-action="board-post-click" data-board-type="${board}" data-post-id="${board}_${index+1}" data-post-title="${esc(title)}">${esc(title)}</button><time>2026.07.${String(index+1).padStart(2,'0')}</time></article>`).join('')}</section><div class="pagination">${[1,2,3].map(i=>`<button type="button" data-action="board-pagination-click" data-board-type="${board}" data-page-number="${i}">${i}</button>`).join('')}</div>`;
    bindRoutes(main);$$('[data-action="board-post-click"]').forEach(btn=>btn.addEventListener('click',()=>showToast(`${btn.dataset.postTitle} 게시글 클릭`)));
  }

  function renderLookbook(main){
    main.dataset.pageType='lookbook';
    main.innerHTML=`<section class="page-hero"><span>EDITORIAL</span><h1>LOOKBOOK</h1><p>콘텐츠 카드 노출·클릭·스크롤 분석용 페이지입니다.</p></section><section class="editorial-grid">${[['contour','CONTOUR','형태와 빛의 경계'],['breeze','SUNNY BREEZE','가벼운 여름의 질감'],['essence','THE ESSENCE','기본의 새로운 균형'],['afterglow','AFTERGLOW','늦은 오후의 색']].map(([id,title,desc],i)=>`<article data-component="lookbook-card" data-content-id="lookbook_${id}" data-content-index="${i+1}"><div class="editorial-art art-${i+1}"><span>${title}</span></div><span>EDITORIAL ${String(i+1).padStart(2,'0')}</span><h2>${desc}</h2><button type="button" data-action="lookbook-open-click" data-content-id="lookbook_${id}" data-content-title="${title}">VIEW STORY →</button></article>`).join('')}</section>`;
    $$('[data-action="lookbook-open-click"]').forEach(btn=>btn.addEventListener('click',()=>showToast(`${btn.dataset.contentTitle} 룩북 클릭`)));
  }

  function renderCelebrity(main){
    main.dataset.pageType='celebrity';
    main.innerHTML=`<section class="page-hero"><span>CELEBRITY</span><h1>WORN BY</h1><p>가상의 셀럽 착용 콘텐츠입니다. 인물 식별이나 실제 협찬 정보는 포함하지 않습니다.</p></section><section class="celebrity-grid">${PRODUCTS.slice(0,6).map((p,i)=>`<article data-component="celebrity-card" data-content-id="celebrity_${i+1}" ${dataset(itemData(p,{contentIndex:i+1}))}><div class="portrait-placeholder"><span>STYLE ${i+1}</span></div><h2>Editorial Muse ${String(i+1).padStart(2,'0')}</h2><p>${esc(p.nameKo)}</p><a data-action="celebrity-product-click" ${dataset(itemData(p,{contentId:`celebrity_${i+1}`}))} data-route="product/detail.html?product_no=${p.id}">착용 상품 보기 →</a></article>`).join('')}</section>`;
    bindRoutes(main);
  }

  function routePageName(){
    const path = routeParts().path;
    const map = {
      '': 'home',
      'index.html': 'home',
      'product/list.html': 'list',
      'product/detail.html': 'detail',
      'product/search.html': 'search',
      'order/basket.html': 'basket',
      'member/login.html': 'login',
      'member/agreement.html': 'agreement',
      'member/oauth.html': 'oauth',
      'order/orderform.html': 'orderform',
      'order/order_result.html': 'order_result',
      'myshop/order/list.html': 'orders',
      'community/list.html': 'community',
      'content/lookbook.html': 'lookbook',
      'content/celebrity.html': 'celebrity'
    };
    return map[path] || 'home';
  }

  function syncRouteState(){
    const main = $('main[data-page]');
    const parts = routeParts();
    if (main) main.dataset.page = routePageName();
    document.body.dataset.routePath = parts.path;
    document.body.dataset.routeQuery = parts.search;
    document.documentElement.dataset.singleFileLab = 'true';
  }

  function renderPage(){
    const main=$('main[data-page]'); if(!main) return;
    const page=main.dataset.page;
    ({home:renderHome,list:renderList,detail:renderDetail,search:renderSearch,basket:renderBasket,login:renderLogin,agreement:renderAgreement,oauth:renderOauth,orderform:renderOrderForm,order_result:renderOrderResult,orders:renderOrders,community:renderCommunity,lookbook:renderLookbook,celebrity:renderCelebrity}[page]||renderHome)(main);
  }

  function bindGlobal(){
    document.addEventListener('keydown',event=>{if(event.key==='Escape'){ $('.search-overlay.open [data-action="search-close"]')?.click(); $('.mobile-drawer.open [data-action="mobile-menu-close"]')?.click(); $('.campaign-popup [data-action="popup-close"]')?.click(); $('.newsletter-popup [data-action="newsletter-popup-close"]')?.click(); }});
  }

  function init(){
    syncRouteState(); renderHeader(); renderFooter(); renderPage(); applyIdentity(); updateCartCount(); bindRoutes(); bindGlobal(); floatingBenefitButton(); consentBanner();
    if($('main[data-page="home"]') && read(STORE.popupDay,'')!==todayKey()) setTimeout(()=>openCampaignPopup('automatic'),550);
  }

  window.NoveraLab={PRODUCTS,rootUrl,openCampaignPopup,openNewsletterPopup,identity};
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();

</script>
</body>
</html>
